                  - id: 0ee8bafb-4d63-4075-9e5f-9635e8b1c82f
                    status: pending
                    contact_id: 5ca7bc74-7c1b-4a4f-9721-e5339c9b002d
                    template_id: 37141eaf-923f-44e9-bf7d-2dc6500cbba3
                    creator_id: e68a6422-fdb4-4c64-922a-8ac109b3ed33
                    document_url: null
                    completed_at: null
                    created_at: '2026-07-17T13:09:54Z'
                  - id: 7b12d80f-bbde-4b3f-ba2c-94773162c603
                    status: pending
                    contact_id: 727b51af-219a-4611-949c-bf08e0869ccc
                    template_id: 37141eaf-923f-44e9-bf7d-2dc6500cbba3
                    creator_id: e68a6422-fdb4-4c64-922a-8ac109b3ed33
                    document_url: null
                    completed_at: null
                    created_at: '2026-07-17T13:09:54Z'
        '401':
          description: 'unauthorized: the Authorization header is missing or invalid'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 401
                    title: Unauthorized
                    message: Invalid API token
              schema:
                $ref: '#/components/schemas/error_unauthorized'
        '404':
          description: 'not found: the resource is not found'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 404
                    title: Not Found
                    message: Resource not found
              schema:
                $ref: '#/components/schemas/error_not_found'
        '429':
          description: 'too many requests: the user has reached the rate limit'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 429
                    title: Too Many Requests
                    message: Rate limit reached. Please wait for a couple of minutes.
              schema:
                $ref: '#/components/schemas/error_too_many_requests'
    post:
      summary: Creates a submission for a smartdoc
      security:
      - bearer_auth: []
      description: 'Creates a submission for a smartdoc. If the smartdoc doesn''t contain any fields, or if wrong party IDs are given, it cannot be submitted and the endpoint will return a 422 - unprocessable content error. The parameter contact_id is deprecated. Use party_signer_ids instead. The parameter party_signer_ids is an object mapping party ID to contact ID: keys are party IDs and values are contact IDs. Give as many key-value pairs as there are parties in the smartdoc. '
      tags:
      - smartdoc
      parameters:
      - name: seal_template_id
        in: path
        required: true
        description: Seal template ID
        schema:
          type: string
      responses:
        '201':
          description: Submission created
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json; charset=utf-8
            X-Organization-ID:
              schema:
                type: string
              description: The organization ID
            X-Rate-Limit:
              schema:
                type: integer
              description: Max allowed requests in the current period
            X-Remaining-Requests:
              schema:
                type: integer
              description: Remaining requests in the current period
          content:
            application/json:
              examples:
                example:
                  value:
                    id: 34e8fb6e-fa78-49a6-b703-8b5cd7b73832
                    status: pending
                    contact_id: 4dcc1e4a-db2a-4225-8f5b-917f369b11f8
                    template_id: 685e316e-4079-42db-9aaa-36baf84bc9a1
                    creator_id: e68a6422-fdb4-4c64-922a-8ac109b3ed33
                    document_url: null
                    completed_at: null
                    created_at: '2026-07-17T13:09:55Z'
        '400':
          description: 'bad request: the request is invalid'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 400
                    title: Bad Request
                    message: Invalid signers parameters. Please use the contact_id or party_signer_ids parameter.
              schema:
                $ref: '#/components/schemas/error_bad_request'
        '401':
          description: 'unauthorized: the Authorization header is missing or invalid'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 401
                    title: Unauthorized
                    message: Invalid API token
              schema:
                $ref: '#/components/schemas/error_unauthorized'
        '404':
          description: 'not found: the resource is not found'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 404
                    title: Not Found
                    message: Resource not found
              schema:
                $ref: '#/components/schemas/error_not_found'
        '422':
          description: 'unprocessable: not created when wrong party ID given or the smartdoc doesn''t contain any fields'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 422
                    title: Unprocessable Content
                    message: ''
              schema:
                $ref: '#/components/schemas/error_unprocessable_content'
        '429':
          description: 'too many requests: the user has reached the rate limit'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 429
                    title: Too Many Requests
                    message: Rate limit reached. Please wait for a couple of minutes.
              schema:
                $ref: '#/components/schemas/error_too_many_requests'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                party_signer_ids:
                  type: object
                  example:
                    10a1a838-aa60-437f-afed-0ac318d05c29: a0a0e818-749a-41d6-b898-43fa3ea55dd8
                    b5a94430-d97e-4eb2-9e2d-1c656e0f493d: b2b0e818-749a-41d6-b898-43fa3ea55ee9
                creator_id:
                  type: string
                  example: a0a0e818-749a-41d6-b898-43fa3ea55dd8
                creator_email:
                  type: string
                  example: john.doe@example.com
        required: true
        description: Submission attributes
