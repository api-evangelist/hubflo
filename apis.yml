aid: hubflo
name: Hubflo
description: >-
  Hubflo is a client portal platform for service businesses — consultants, agencies,
  accountants, and professional-service firms — bringing client onboarding, messaging,
  document management, e-signatures, forms, proposals, invoicing, tasks, and project
  collaboration into one branded workspace. Hubflo exposes a REST API (v2) at
  app.hubflo.com/api/v2 with bearer-token authentication, JSON request/response bodies,
  UUID resource identifiers, page-based pagination, a 1000 request/minute rate limit, and
  a native webhook system spanning 29 event types across companies, contacts, workspaces,
  invoices, forms, tasks, and e-signature submissions. Hubflo also publishes official
  TypeScript and MCP-server packages and a hosted remote MCP server. Backed by Seedcamp.
