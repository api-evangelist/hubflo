openapi: 3.0.1
info:
  title: Hubflo API
  version: v2
  description: "The Hubflo API allows you to write and read data from the Hubflo application.\nIt conforms\
    \ to [REST](https://en.wikipedia.org/wiki/REST).\nIt has predictable resource-oriented URLS, accepts\
    \ JSON request bodies, returns JSON and uses standard HTTP status codes\nand verbs.\n\n# Authentication\n\
    \nThe Hubflo API requires authentication.\nIt's a bearer authentication, also called token authentication.\n\
    \nTo start your integration journey with the Hubflo API, you must send your **authentication token**\
    \ in the\n`Authorization` header when making requests to the API.\n\n```\nAuthorization: Bearer <token>\n\
    ```\n\n# Getting started\n\nNavigate to [https://app.hubflo.com/organizations/](https://app.hubflo.com/organizations/).\n\
    In the **Integrations** settings panel, click on the **Generate key** button if you don't already\
    \ have an API key.\n\nThe generated API key is the required authentication token you must send in\
    \ the `Authorization` header.\nLet's copy it.\n\nYou can use the `/pings` endpoint to check that you\
    \ can successfully make an authenticated request.\nDo it directly from this documentation, using the\
    \ **Authorize** button to paste your authentication token, then push\nthe **Try it out** button.\n\
    \nAlternatively, you can run the following cURL command in a terminal:\n\n```\ncurl -X 'POST' \\\n\
    \  'https://app.hubflo.com/api/v2/pings' \\\n  -H 'accept: application/json' \\\n  -H 'Authorization:\
    \ Bearer <token>' \\\n  -d ''\n```\n\nIf you're successfully authenticated, you receive:\n\n```json\n\
    {\n  \"pong\": \"ok\"\n}\n```\n\nOtherwise you get a `401 - Unauthorized` error. For example:\n\n\
    ```json\n{\n  \"status\": 401,\n  \"title\": \"Unauthorized\",\n  \"message\": \"API token not found\"\
    \n}\n```\n\n# Versioning\n\nThe API is versioned. The current version is 2.0 (referenced as v2 in\
    \ the endpoints).\n\n# Routes\n\nThe API endpoints are accessible through a route of the form: `https://<domain>/api/<version>/<endpoint>`.\n\
    \nWhere:\n\n- `domain` is the domain to use, usually \"app.hubflo.com\"\n- `version` is the API version\n\
    - `endpoint` is the endpoint name\n\nFor example, we will have: `https://app.hubflo.com/api/v2/pings`.\n\
    \n# Request headers\n\nEvery request should include the header `Content-Type: application/json`, except\
    \ for file uploads.\n\n# Requests and parameters\n\nThe API adheres to REST principles:\n\n- `GET`\
    \ requests: read without modification\n- `POST` requests: create a new resource\n- `PATCH` requests:\
    \ update an existing resource\n- `DELETE` requests: delete a resource\n\nThe parameters for `GET`\
    \ requests should be sent via the query string of the request.\n\nThe parameters for `POST` and `PATCH`\
    \ requests should be transmitted in the request body in a valid JSON format.\n\nThe parameters should\
    \ follow the following formats:\n- `date`: \"YYYY-MM-DD\", for example: \"2021-10-21\"\n- `time`:\
    \ \"H:m[:s]\", for example: \"10:30\"\n- `date-time`: \"YYYY-MM-DDThh:mm:ssZ\", which is the [ISO\
    \ 8601](https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations) format, using\
    \ UTC\n\n# Response headers\n\nAs specified for each endpoint, the response headers contain:\n- `Content-Type`:\
    \ the response content type\n- `X-Organization-ID`: your organization ID\n- `X-Rate-Limit` the maximum\
    \ allowed requests in a given period\n- `X-Remaining-Requests`: the remaining requests count in the\
    \ current period\n\n# Response format\n\nThe API only supports JSON format.\nAll responses sent by\
    \ the API will contain the header `Content-Type: application/json` and their content is present in\n\
    the body in a JSON format to be de-serialized.\n\n# Rate limit\n\nThe use of the API is limited.\n\
    You can make a maximum of 1000 calls per minute.\nIf you exceed this limit, you receive a `429 - Too\
    \ Many Requests` error and are blocked for one minute.\n\n# Pagination\n\nAll endpoints that return\
    \ lists are paginated.\nIn general, any endpoint that returns a list can return an empty list.\n\n\
    The (optional) `page` parameter allows you to access a specific page.\n\nThe (optional) `per_page`\
    \ parameter allows you to change the number of items on a given page.\nThe default value is 20 and\
    \ it is limited to a maximum of 100.\n\n# Response codes\n\nThe API may return the following codes:\n\
    \n| Code  | Name                  | Description                                                  \
    \                    |\n| ----  | --------              | --------                               \
    \                                          |\n| `200` | Success               | Success          \
    \                                                                |\n| `201` | Created            \
    \   | Resource created                                                                 |\n| `204`\
    \ | No Content            | Success but the response does not contain any data (e.g., deletion)  \
    \            |\n| `400` | Bad Request           | The request is invalid                         \
    \                                  |\n| `401` | Unauthorized          | Authentication failed    \
    \                                                        |\n| `403` | Forbidden             | Insufficient\
    \ rights to perform the requested action                              |\n| `404` | Not Found     \
    \        | The resource is not found                                                        |\n| `422`\
    \ | Unprocessable Content  | The transmitted data is malformed                                   \
    \             |\n| `429` | Too Many Requests     | Too many requests have been made              \
    \                                   |\n| `500` | Internal Server Error | An internal server error\
    \ occurred (the technical team is automatically notified) |\n\n# Errors\n\nWhen an error occurs, the\
    \ response code informs you about what is happening.\nThe response body contains:\n- the status code,\n\
    - the status name, a.k.a the error title,\n- a human readable message.\n\nSee the error schemas below.\n\
    \n# Resources\n\nAll resources are identified by a unique ID that looks like this: \"16242d6f-a808-41b7-8c4d-fe29b9b3245f\"\
    .\n\nJSON data types are used at most: `string`, `number`, `float`, `object`, `array`, `boolean` and\
    \ `null`.\nDates and datetimes attributes are serialized with UTC [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations)\
    \ format.\n\n\n"
paths:
  /api/v2/messages/{message_id}/files:
    parameters:
    - name: message_id
      in: path
      required: true
      description: Message ID
      schema:
        type: string
    get:
      summary: Retrieves the files for a message
      security:
      - bearer_auth: []
      description: Returns the files attached to a message
      tags:
      - message
      parameters:
      - name: page
        in: query
        required: false
        description: Page number
        example: 1
        schema:
          type: number
      - name: per_page
        in: query
        required: false
        description: Number of items per page (max 100)
        example: 10
        schema:
          type: number
      responses:
        '200':
          description: files retrieved
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json; charset=utf-8
            X-Organization-ID:
              schema:
                type: string
              description: The organization ID
            X-Rate-Limit:
              schema:
                type: integer
              description: Max allowed requests in the current period
            X-Remaining-Requests:
              schema:
                type: integer
              description: Remaining requests in the current period
            X-Page:
              schema:
                type: integer
              description: Current page number
            X-Per-Page:
              schema:
                type: integer
              description: Number of items per page
            X-Total-Pages:
              schema:
                type: integer
              description: Total number of pages
            X-Next-Page:
              schema:
                type: integer
                nullable: true
              description: Next page number
            X-Prev-Page:
              schema:
                type: integer
                nullable: true
              description: Previous page number
            X-Total-Count:
              schema:
                type: integer
              description: Total number of items
          content:
            application/json:
              examples:
                example:
                  value:
                  - message_id: 94ab136c-8ff4-4325-be7d-da1fdecd7ca1
                    file_name: image1.png
                    content_type: image/png
                    url: http://www.example.com/rails/active_--a3381fd15cb17f639c98f67f7fd8f7f53515aa39/image1.png
                  - message_id: 94ab136c-8ff4-4325-be7d-da1fdecd7ca1
                    file_name: image1.png
                    content_type: image/png
                    url: http://www.example.com/rails/active_--6f8e9a1fdf9c5de080ece466352a6d99558ecd98/image1.png
        '401':
          description: 'unauthorized: the Authorization header is missing or invalid'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 401
                    title: Unauthorized
                    message: Invalid API token
              schema:
                $ref: '#/components/schemas/error_unauthorized'
        '404':
          description: 'not found: the resource is not found'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 404
                    title: Not Found
                    message: Resource not found
              schema:
                $ref: '#/components/schemas/error_not_found'
        '429':
          description: 'too many requests: the user has reached the rate limit'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 429
                    title: Too Many Requests
                    message: Rate limit reached. Please wait for a couple of minutes.
              schema:
                $ref: '#/components/schemas/error_too_many_requests'
