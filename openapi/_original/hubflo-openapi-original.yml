      - chat_room
      parameters:
      - name: chat_room_id
        in: path
        required: true
        description: Chat room ID
        schema:
          type: string
      - name: user_id
        in: query
        required: true
        description: User ID
        schema:
          type: string
      - name: body
        in: query
        required: true
        description: Message body
        schema:
          type: string
      - name: private
        in: query
        required: false
        description: Private message
        schema:
          type: boolean
      responses:
        '201':
          description: Message created
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json; charset=utf-8
            X-Organization-ID:
              schema:
                type: string
              description: The organization ID
            X-Rate-Limit:
              schema:
                type: integer
              description: Max allowed requests in the current period
            X-Remaining-Requests:
              schema:
                type: integer
              description: Remaining requests in the current period
          content:
            application/json:
              examples:
                example:
                  value:
                    id: bf06eddf-0633-4494-89d2-2fb35ddf6d9f
                    chat_room_id: 73b4c234-198c-4db7-8ec1-6ac3fd5ca0a3
                    body: <p>Hello World! <a target="_blank" rel="noopener noreferrer nofollow" href="https://google.com"><u>google.com</u></a>
                      and <a target="_blank" rel="noopener noreferrer nofollow" href="https://hubflo.com"><u>hubflo.com</u></a></p>
                    private: false
                    participant_id: e68a6422-fdb4-4c64-922a-8ac109b3ed33
                    participant_type: User
                    created_at: '2026-07-17T13:08:49Z'
                    files_count: 0
        '401':
          description: 'unauthorized: the Authorization header is missing or invalid'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 401
                    title: Unauthorized
                    message: Invalid API token
              schema:
                $ref: '#/components/schemas/error_unauthorized'
        '429':
          description: 'too many requests: the user has reached the rate limit'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 429
                    title: Too Many Requests
                    message: Rate limit reached. Please wait for a couple of minutes.
              schema:
                $ref: '#/components/schemas/error_too_many_requests'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: array
              items:
                type: string
                format: binary
        description: Files to attach
