                    message: Rate limit reached. Please wait for a couple of minutes.
              schema:
                $ref: '#/components/schemas/error_too_many_requests'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Hubflo
                website:
                  type: string
                  example: https://hubflo.com
                business_description:
                  type: string
                  example: All-in-one client portal
                accent_color:
                  type: string
                  example: '#FF6B00'
                sidebar_color:
                  type: string
                  example: '#1A1A1A'
                sidebar_text_color:
                  type: string
                  example: '#FFFFFF'
                menu_tasks_visibility:
                  type: boolean
                  example: true
                menu_messaging_visibility:
                  type: boolean
                  example: true
                menu_forms_visibility:
                  type: boolean
                  example: true
                menu_billing_visibility:
                  type: boolean
                  example: true
                menu_smartdocs_visibility:
                  type: boolean
                  example: false
                menu_workflows_visibility:
                  type: boolean
                  example: true
                project_module_enabled:
                  type: boolean
                  example: true
                project_wording:
                  type: string
                  enum:
                  - account
                  - project
                  - intervention
                  - mission
                  - mandate
                  - construction
                  - property
                  - opportunity
                  - event
                  - booking
                  - file
                  - training
                  - campaign
                  - application
                  - student
                  - order
                  - matter
                  - claim
                  - ticket
                  - journey
                  example: mission
                enable_2fa_on_users:
                  type: boolean
                  example: true
                enable_2fa_on_contact_authentications:
                  type: boolean
                  example: true
        required: true
        description: Organization attributes
      operationId: patchApiV2Organizations
      x-operation-id-source: derived
components:
  schemas:
    error_too_many_requests:
      description: A response describing a rate limit error
      type: object
      properties:
        status:
          type: integer
          example: 429
        title:
          type: string
          example: Too Many Requests
        message:
          type: string
          example: Rate limit reached. Please wait for a couple of minutes.
      required:
      - status
      - title
      - message
    error_unauthorized:
      description: A response describing an authentication error
      type: object
      properties:
        status:
          type: integer
          example: 401
        title:
          type: string
          example: Unauthorized
        message:
          type: string
          example: API token not found
      required:
      - status
      - title
      - message
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
x-readme:
  explorer-enabled: true
  proxy-enabled: true
