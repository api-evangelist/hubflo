                    owner_id: e68a6422-fdb4-4c64-922a-8ac109b3ed33
                    project_id: null
                    recipient_id: cdffacd6-f2b6-4bea-93a1-ca3a4d172296
                    parent_invoice_id: null
        '400':
          description: 'bad request: the request is invalid'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 400
                    title: Bad Request
                    message: Paid at must be filled in, Payment method used must be filled in
              schema:
                $ref: '#/components/schemas/error_bad_request'
        '401':
          description: 'unauthorized: the Authorization header is missing or invalid'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 401
                    title: Unauthorized
                    message: Invalid API token
              schema:
                $ref: '#/components/schemas/error_unauthorized'
        '404':
          description: 'not found: the resource is not found'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 404
                    title: Not Found
                    message: Resource not found
              schema:
                $ref: '#/components/schemas/error_not_found'
        '429':
          description: 'too many requests: the user has reached the rate limit'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 429
                    title: Too Many Requests
                    message: Rate limit reached. Please wait for a couple of minutes.
              schema:
                $ref: '#/components/schemas/error_too_many_requests'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                paid_at:
                  type: string
                  format: date-time
                  example: '2024-01-01T00:00:00Z'
                payment_method_used:
                  type: string
                  enum:
                  - bank_transfer
                  - bank_card
                  - direct_debit
                  - check
                  - cash
                  - ach
                  - paypal
                  - other
                  example: bank_transfer
                paid_amount:
                  type: number
                  example: 200
              required:
              - paid_at
              - payment_method_used
              - paid_amount
        required: true
        description: Payment notice attributes
