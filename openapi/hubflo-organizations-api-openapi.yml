    patch:
      summary: Updates the current organization
      security:
      - bearer_auth: []
      description: Returns the updated organization
      tags:
      - Organizations
      parameters: []
      responses:
        '200':
          description: Organization updated
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json; charset=utf-8
            X-Organization-ID:
              schema:
                type: string
              description: The organization ID
            X-Rate-Limit:
              schema:
                type: integer
              description: Max allowed requests in the current period
            X-Remaining-Requests:
              schema:
                type: integer
              description: Remaining requests in the current period
          content:
            application/json:
              examples:
                example:
                  value:
                    id: 119b3247-c1ef-42fa-acc7-c63b3ebf0374
                    name: Updated name
                    website: https://updated.example.com
                    business_description: Updated business description
                    accent_color: '#FF6B00'
                    sidebar_color: '#1A1A1A'
                    sidebar_text_color: '#FFFFFF'
                    menu_tasks_visibility: false
                    menu_messaging_visibility: false
                    menu_forms_visibility: false
                    menu_billing_visibility: false
                    menu_smartdocs_visibility: false
                    menu_workflows_visibility: false
                    currency: EUR
                    project_module_enabled: false
                    project_wording: mission
                    enable_2fa_on_users: true
                    enable_2fa_on_contact_authentications: true
                    country_subscription: FR
                    created_at: '2026-07-17T13:08:42Z'
