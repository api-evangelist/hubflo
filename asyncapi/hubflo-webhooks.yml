note: >-
  Hubflo publishes a native webhook surface (not an AsyncAPI document). Webhooks are
  managed via the REST API: create a webhook target with a delivery URL and a set of
  subscribed event_names, activate/deactivate it, and inspect delivery attempts.
management:
  create: POST /api/v2/webhooks
  delete: DELETE /api/v2/webhooks/{id}
  activate: POST /api/v2/webhooks/{webhook_target_id}/activation
  deactivate: DELETE /api/v2/webhooks/{webhook_target_id}/activation
  deliveries: GET /api/v2/webhooks/{webhook_target_id}/webhook_deliveries
subscription:
  target_field: url
  events_field: event_names
