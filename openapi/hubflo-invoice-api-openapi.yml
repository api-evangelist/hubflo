      x-operation-id-source: derived
  /api/v2/invoices/{invoice_id}/payment-notice:
    post:
      summary: Creates a payment notice
      security:
      - bearer_auth: []
      description: Create a payment notice for a given invoice, and mark it as paid. In case of partial payment, it will add up.
      tags:
      - Invoice
      parameters:
      - name: invoice_id
        in: path
        required: true
        description: Invoice ID
        schema:
          type: string
      responses:
        '201':
          description: Payment notice created (invoice marked as paid)
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json; charset=utf-8
            X-Organization-ID:
              schema:
                type: string
              description: The organization ID
            X-Rate-Limit:
              schema:
                type: integer
              description: Max allowed requests in the current period
            X-Remaining-Requests:
              schema:
                type: integer
              description: Remaining requests in the current period
          content:
            application/json:
              examples:
                example:
                  value:
                    id: 3fc352f9-4128-4a4d-9094-4cacd67f7d11
                    title: Invoice 14
                    description: null
                    comment: null
                    language: fr
                    purchase_order_reference: null
                    payment_terms: 'Please remit payment to: XXX.

                      Late payments may be subject to an additional charge of [X]% per month on the outstanding balance.'
                    payment_deadline_days: 30
                    payment_methods:
                    - bank_transfer
                    payment_method_used: cash
                    use_stripe_as_payment_method: false
                    stripe_auto_charge: false
                    payment_url: null
                    currency: EUR
                    accounting_id: null
                    status: paid
                    created_at: '2026-07-17T13:09:32Z'
                    issued_at: '2026-07-10T13:09:32Z'
                    custom_issued_at: null
                    paid_at: '2024-01-01T00:00:00Z'
                    sent_at: null
                    net_total: 2200
                    tax_total: 200
                    paid_amount: 200
                    public_url: http://localhost:3000/invoices/3fc352f9-4128-4a4d-9094-4cacd67f7d11/access/beadbf63-7cfe-4e78-8060-9756fd76d1d1
                    owner_id: e68a6422-fdb4-4c64-922a-8ac109b3ed33
                    project_id: null
                    recipient_id: cdffacd6-f2b6-4bea-93a1-ca3a4d172296
                    parent_invoice_id: null
        '400':
          description: 'bad request: the request is invalid'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 400
                    title: Bad Request
                    message: Paid at must be filled in, Payment method used must be filled in
              schema:
                $ref: '#/components/schemas/error_bad_request'
        '401':
          description: 'unauthorized: the Authorization header is missing or invalid'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 401
                    title: Unauthorized
                    message: Invalid API token
              schema:
                $ref: '#/components/schemas/error_unauthorized'
        '404':
          description: 'not found: the resource is not found'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 404
                    title: Not Found
                    message: Resource not found
              schema:
                $ref: '#/components/schemas/error_not_found'
        '429':
          description: 'too many requests: the user has reached the rate limit'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 429
                    title: Too Many Requests
                    message: Rate limit reached. Please wait for a couple of minutes.
              schema:
                $ref: '#/components/schemas/error_too_many_requests'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                paid_at:
                  type: string
                  format: date-time
                  example: '2024-01-01T00:00:00Z'
                payment_method_used:
                  type: string
                  enum:
                  - bank_transfer
                  - bank_card
                  - direct_debit
                  - check
                  - cash
                  - ach
                  - paypal
                  - other
                  example: bank_transfer
                paid_amount:
                  type: number
                  example: 200
              required:
              - paid_at
              - payment_method_used
              - paid_amount
        required: true
        description: Payment notice attributes
      operationId: postApiV2InvoicesByInvoiceIdPaymentNotice
      x-operation-id-source: derived
