- name: organizations
paths:
  /api/v2/organizations/cover:
    post:
      summary: Uploads the organization cover
      security:
      - bearer_auth: []
      description: Replaces the organization cover. The image is sent as multipart/form-data.
      tags:
      - organizations
      parameters: []
      responses:
        '201':
          description: Cover uploaded
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json; charset=utf-8
            X-Organization-ID:
              schema:
                type: string
              description: The organization ID
            X-Rate-Limit:
              schema:
                type: integer
              description: Max allowed requests in the current period
            X-Remaining-Requests:
              schema:
                type: integer
              description: Remaining requests in the current period
          content:
            application/json:
              examples:
                example:
                  value:
                    id: 119b3247-c1ef-42fa-acc7-c63b3ebf0374
                    name: Organization
                    website: null
                    business_description: null
                    accent_color: '#8AA3D9'
                    sidebar_color: '#FCFCFC'
                    sidebar_text_color: '#060520'
                    menu_tasks_visibility: true
                    menu_messaging_visibility: true
                    menu_forms_visibility: true
                    menu_billing_visibility: true
                    menu_smartdocs_visibility: true
                    menu_workflows_visibility: false
                    currency: EUR
                    project_module_enabled: true
                    project_wording: account
                    enable_2fa_on_users: false
                    enable_2fa_on_contact_authentications: false
                    country_subscription: FR
                    created_at: '2026-07-17T13:08:42Z'
                    portal_subdomain: client
                    portal_host: client.example.com
                    logo_url: null
                    cover_url: http://www.example.com/rails/active_--6e72d84cf75f5e2c8f0275ecbfb48a3c3e9b8ca0/600x600.png
        '401':
          description: 'unauthorized: the Authorization header is missing or invalid'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 401
                    title: Unauthorized
                    message: Invalid API token
              schema:
                $ref: '#/components/schemas/error_unauthorized'
        '429':
          description: 'too many requests: the user has reached the rate limit'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 429
                    title: Too Many Requests
                    message: Rate limit reached. Please wait for a couple of minutes.
              schema:
                $ref: '#/components/schemas/error_too_many_requests'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: string
              format: binary
        required: true
        description: Cover to upload
    delete:
      summary: Deletes the organization cover
      security:
      - bearer_auth: []
      description: Removes the organization cover
      tags:
      - organizations
      responses:
        '204':
          description: Cover deleted
          headers:
            X-Organization-ID:
              schema:
                type: string
              description: The organization ID
            X-Rate-Limit:
              schema:
                type: integer
              description: Max allowed requests in the current period
            X-Remaining-Requests:
              schema:
                type: integer
              description: Remaining requests in the current period
          content:
            application/json:
              examples:
                example:
                  value: ''
        '401':
          description: 'unauthorized: the Authorization header is missing or invalid'
          content:
            application/json:
              examples:
                example:
                  value:
                    status: 401
                    title: Unauthorized
                    message: Invalid API token
              schema:
                $ref: '#/components/schemas/error_unauthorized'
        '429':
          description: 'too many requests: the user has reached the rate limit'
          content:
            application/json:
              examples:
